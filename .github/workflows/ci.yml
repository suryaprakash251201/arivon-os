name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Go lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: cli
          args: --timeout=5m

      - name: Shell lint
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./build"
          severity: warning

      - name: Check formatting
        working-directory: cli
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -d .; exit 1; }

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Go tests
        working-directory: cli
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Coverage report
        working-directory: cli
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cli/coverage.out

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
          working-directory: cli

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: cli/results.sarif

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build CLI
        working-directory: cli
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -ldflags "-X github.com/arivon/arivon-os/cli/cmd.arivonVersion=${GITHUB_SHA::7}" \
            -o ../build/arivon-${{ matrix.arch }} .

      - name: Build installer
        if: matrix.arch == 'amd64'
        working-directory: installer
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build/arivon-installer .

      - name: Build .deb
        if: matrix.arch == 'amd64'
        run: |
          chmod +x packages/build-deb.sh
          ./packages/build-deb.sh 0.1.0-test amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arivon-${{ matrix.arch }}
          path: |
            build/arivon-${{ matrix.arch }}
            build/arivon-installer
            images/output/*.deb
          if-no-files-found: ignore
