name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: cli

      - name: Shell lint
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./build"
          severity: warning

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go tests
        working-directory: cli
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Coverage report
        working-directory: cli
        run: go tool cover -func=coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build CLI
        working-directory: cli
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build/arivon .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../build/arivon-arm64 .

      - name: Build installer
        working-directory: installer
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build/arivon-installer .

      - name: Build .deb
        run: |
          chmod +x packages/build-deb.sh
          ./packages/build-deb.sh 0.1.0-test amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arivon-artifacts
          path: |
            build/arivon
            build/arivon-arm64
            build/arivon-installer
            images/output/*.deb
