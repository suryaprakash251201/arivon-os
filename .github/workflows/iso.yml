name: ISO Build

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - minimal
          - server
          - docker
          - network
          - full

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build image (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ ((inputs.profile == '') || (inputs.profile == 'all')) && fromJSON('["minimal","server","docker","network","full"]') || fromJSON(format('["{0}"]', inputs.profile)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip systemd-container systemd-boot kmod debootstrap debian-archive-keyring mtools dosfstools qemu-utils dpkg-dev
          sudo python3 -m pip install --break-system-packages git+https://github.com/systemd/mkosi.git@v25
          mkosi --version

      - name: Build CLI
        working-directory: cli
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X github.com/arivon/arivon-os/cli/cmd.arivonVersion=0.1.0-${GITHUB_SHA::7}" \
            -o ../build/arivon .

      - name: Build installer
        working-directory: installer
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build/arivon-installer .

      - name: Build .deb
        run: |
          chmod +x packages/build-deb.sh
          ./packages/build-deb.sh 0.1.0-${GITHUB_SHA::7} amd64

      - name: Build disk image
        run: |
          cd images
          sudo mkosi --profile=${{ matrix.profile }} -o arivon-os-${{ matrix.profile }} build

      - name: Convert to qcow2
        run: |
          cd images/output
          qemu-img convert -f raw -O qcow2 arivon-os-${{ matrix.profile }}.raw arivon-os-${{ matrix.profile }}.qcow2
          ls -lh arivon-os-${{ matrix.profile }}.*

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: arivon-os-${{ matrix.profile }}-image
          path: |
            images/output/arivon-os-${{ matrix.profile }}.raw
            images/output/arivon-os-${{ matrix.profile }}.qcow2
          if-no-files-found: error

      - name: Create nightly release
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.sha }}
          name: "Nightly Image Build — ${{ matrix.profile }}"
          body: |
            Automated nightly disk image build for profile: ${{ matrix.profile }}
            Commit: ${{ github.sha }}
            Bootable GPT disk image (dd to USB or boot in QEMU).
          files: |
            images/output/arivon-os-${{ matrix.profile }}.raw
            images/output/arivon-os-${{ matrix.profile }}.qcow2
          fail_on_unmatched_files: false
          prerelease: true
