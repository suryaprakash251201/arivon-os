# Arivon OS SSH hardening drop-in
# Managed by: arivon ssh harden
# Do not edit manually.

PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
Banner /etc/arivon/ssh_banner
