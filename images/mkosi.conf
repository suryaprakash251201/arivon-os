[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
OutputDirectory=output
ImageId=arivon-os
Bootable=yes
Bootloader=systemd-boot

[Content]
Packages=
    systemd
    systemd-sysv
    systemd-timesyncd
    dbus
    linux-image-amd64
    initramfs-tools
    openssh-server
    apt
    sudo
    iproute2
    iputils-ping
    ca-certificates
    locales
    tzdata
    systemd-boot
    systemd-boot-efi
    mtools
    dosfstools
